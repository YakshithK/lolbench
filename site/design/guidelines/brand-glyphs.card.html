<!-- @dsCard group="Brand" viewport="700x190" name="Glyphs, not icons" subtitle="Every icon is a chart element doing double duty" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px 20px;background:var(--canvas)}</style></head><body><div style="display:flex;gap:28px;flex-wrap:wrap;align-items:center;font-family:var(--mono);font-size:11px;color:var(--ink-3)">
<span style="display:grid;justify-items:center;gap:7px"><span style="width:11px;height:11px;border-radius:50%;background:var(--accent-leader)"></span>a model</span>
<span style="display:grid;justify-items:center;gap:7px"><span style="width:3px;height:22px;background:var(--accent-distrust);display:block"></span>its range</span>
<span style="display:grid;justify-items:center;gap:7px"><span style="width:11px;height:11px;background:var(--ink-mute);display:block"></span>10 answers</span>
<span style="display:grid;justify-items:center;gap:7px"><span style="width:5px;height:11px;background:var(--accent-distrust);display:block"></span>fewer than 10</span>
<span style="display:grid;justify-items:center;gap:7px"><span style="width:26px;height:11px;background:var(--scale-2);display:block"></span>a weak cell</span>
<span style="display:grid;justify-items:center;gap:7px"><span style="width:26px;height:8px;background:var(--well);display:block"><i style="display:block;height:100%;width:60%;background:var(--ink-4)"></i></span>completion</span>
<span style="display:grid;justify-items:center;gap:7px"><span style="color:var(--accent-brand);font-size:15px">→</span>defense row</span>
</div>
<div style="margin-top:18px"><span style="font-family:var(--mono);font-size:11px;color:var(--ink-3)">no icon font, no sprite, no emoji · unicode arrows and middots carry the rest</span></div></body></html>
