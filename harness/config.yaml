# LOL Bench harness config ??? the whole "institutional" setup is this file.
# Every result is stamped with (dataset_version, harness_hash). Bump dataset_version when items change.

dataset_version: "0.3.0"    # tiered real-joke redesign (T1/T2/T3 replace F1-F5); F6 kept verbatim
harness_version: "0.1.4"    # judges now score 0-100 (stored /100) not fixed {0,0.5,1}; judge_validity
                             # reports mean point distance + correlation, not exact-match/kappa; added
                             # hy-judge (3rd judge) to restore a 2-judge coverage floor for every family

# n samples per model-item (documented deviation: v0 runs 3; raised to 10 at C5)
n_samples: 3
anchor_samples: 1          # frontier anchors run once per item (wider CIs, flagged in UI)
lol_b_samples: 1          # voting uses sample 0; extra samples added at C5
max_output_tokens: 2000     # reasoning models: budget includes hidden reasoning tokens
judge_max_tokens: 3000      # judges are reasoning models too; budget covers reasoning + JSON
judge_workers: 1            # per judge; 2 total concurrent Hack Club calls.
                             # Lowered 2->1 on 2026-09-17: the live HC ceiling is
                             # near-single-digit rpm and 4 workers drain the burst
                             # allowance faster than it refills (13 verdicts then
                             # all-429); fallback retries multiply load per row
                             # under throttling. Slower drain = sustained progress.
                             # Revert upward when the account is cool.
parallel_workers: 3            # per-candidate concurrent calls. Lowered 8->3 on 2026-09-08:
                             # Hack Club throttled 10k+ generation calls (429 wall + 521s) at 8 workers.
                             # Matches judge_workers' proven-safe level; throughput comes from fewer
                             # wasted retries, not more concurrency.
temperature: 0.9            # generation diversity; judge calls use temperature 0
max_spend_usd: 100.00        # 2026-09-12: back on free pipes (bai/hackclub),
                             # billed spend is $0; guards estimated-spend runaway only.

# Candidates: five free B.AI models for v0. Paid entries (OpenRouter/xAI)
# stay disabled until keys land.
candidates:
  - name: glm-5.3-flash
    provider: bai
    model: glm-5.3-flash
    family: zai
    enabled: true
  - name: deepseek-v4-flash
    provider: bai
    model: deepseek-v4-flash
    family: deepseek
    enabled: false          # retired 2026-09: same dead free-tier deal as
                             # deepseek-judge, confirmed via a real HTTP 400
                             # (not a rate limit) on every call. Can never get
                             # F6 data under the new rubric - retired rather
                             # than left with a permanent gap, same treatment
                             # as hy4-preview.
  - name: hy3
    provider: bai
    model: hy3
    family: tencent
    enabled: true
  - name: mimo-v2.5
    provider: bai
    model: mimo-v2.5
    family: xiaomi
    enabled: true
  - name: qwen3.8-flash
    provider: bai
    model: qwen3.8-flash
    family: qwen
    enabled: true
  # ---- Tier 2: OSS flagship (OpenRouter, full run) ----
  - name: glm-5.3
    provider: hackclub
    model: z-ai/glm-5.3
    family: zai
    enabled: true
  - name: deepseek-v4-pro
    provider: hackclub
    model: deepseek/deepseek-v4-pro
    family: deepseek
    enabled: true
  - name: qwen3.8-max
    provider: hackclub
    model: qwen/qwen3.8-max
    family: qwen
    enabled: true
  - name: mimo-v2.5-pro
    provider: hackclub
    model: xiaomi/mimo-v2.5-pro
    family: xiaomi
    enabled: true
  - name: hy4-preview
    provider: openrouter
    model: tencent/hy4-preview
    family: tencent
    enabled: false          # removed 2026-09: burns its whole token budget on hidden
                             # reasoning ~27-77% of the time (confirmed via cost log
                             # cross-reference), producing empty outputs that score as
                             # comprehension failures rather than infrastructure ones

  # ---- Tier 4: frontier anchors (OpenRouter/xAI, n=1) ----
  - name: gpt-5.6-sol-pro
    provider: hackclub
    model: openai/gpt-5.6-sol-pro
    family: openai
    anchor: true
    enabled: true           # 2026-09-12: re-enabled for scoring; generation stays
                            # parked (no runner active). Disable again before relaunch
                            # to keep the 429 skip. Tar pit at 251/371.
    think: false            # reasoning disabled: 4x cost cut; anchor tier discloses this
  - name: gemini-3.1-pro
    provider: hackclub
    model: google/gemini-3.1-pro-preview
    family: google
    anchor: true
    enabled: true
  - name: claude-opus-5
    provider: hackclub
    model: anthropic/claude-opus-5
    family: anthropic
    anchor: true
    think: false            # reasoning disabled: 4x cost cut; anchor tier discloses this
    enabled: true
  - name: muse-spark-1.2
    provider: hackclub
    model: meta/muse-spark-1.2
    family: meta
    anchor: true
    enabled: false          # 2026-09-17: skipped mid-run, muse shutter slammed
                            # (1 ok / 39 warn); 184 rows banked, circles back
                            # on the next burst window. See skip-and-rotate.
  - name: grok-4.6
    provider: hackclub
    model: x-ai/grok-4.6
    family: xai
    anchor: true
    enabled: true           # key verified 2026-09-01; owner credits cover cost

# Dual-judge protocol: every model is graded ONLY by judges from a different
# family. Exclusion is by family (the `family` tag on each candidate/judge
# above), not by exact model name — a judge from lab X must never grade any
# candidate from lab X, including sibling models it isn't literally running as.
# exclude_models stays available for one-off manual excludes on top of that.
judges:
  - name: deepseek-judge
    provider: bai
    model: deepseek-v4-flash
    family: deepseek
    exclude_models: []
    enabled: false          # provider free-tier deal ended 2026-09; can't call DeepSeek
                             # anymore. Left in this list (not deleted) so historical
                             # judgments it already made keep their correct family
                             # tag for same-family exclusion checks on old data.
  - name: qwen-judge
    provider: hackclub        # 2026-09-17: bai all-keys 0, kira free dead;
    model: qwen/qwen3.8-flash  # verified live. Family tag unchanged.
    family: qwen
    exclude_models: []
  - name: glm-judge
    provider: bai
    model: glm-5.3-flash
    family: zai
    exclude_models: []
    enabled: false          # 2026-09-12: bai free quota for flash is 0 on all 3 keys
                            # (balance=0). Retired like deepseek-judge: left listed
                            # so its 2,457 historical qwen-family judgments keep
                            # their correct family tag. qwen-family coverage to
                            # date is intact (hy 2457 + glm 2457, both valid).
                            # Next judge launch needs a 3rd-judge replacement
                            # (any non-qwen family) or qwen-family rows go single-judge.
  - name: hy-judge
    provider: hackclub        # 2026-09-17: bai all-keys 0, kira free dead;
    model: tencent/hy3         # verified live. Family tag unchanged.
    family: tencent
    exclude_models: []
  - name: kira-glm-judge
    provider: kira
    model: glm-5.3-free
    family: zai
    exclude_models: []
    enabled: false          # 2026-09-13: recruited as the 3rd-judge backup (zai family -
                            # restores the 2-judge floor for qwen AND tencent candidates the
                            # moment it activates; exactly the redundancy glm-judge's death
                            # removed). NOT for bulk coverage: measured 216s/call on the
                            # judge_f6 rubric (free-tier contention), a full wave would take
                            # days. Verdict quality is excellent - fact-checked a planted
                            # wrong pun mechanism and scored it 10/100. Enable when qwen-judge
                            # or hy-judge dies; b.ai outages now have a standing replacement.
    # Added to restore a 2-judge floor for every family. With only qwen-judge
    # + glm-judge active (post deepseek-judge retirement), qwen-family and
    # zai-family candidates each had exactly 1 eligible judge - no possible
    # inter-judge corroboration for exactly those models. A 3rd judge from a
    # distinct family (tencent) restores floor=2 everywhere: qwen/zai/tencent
    # candidates get exactly 2 (excluding their own judge-sibling), every
    # other family gets all 3.

# Free-tier style rate limits (requests per minute); 0 = unlimited.
rate_limits_rpm:
  bai: 60                   # quota storm on 2026-09-01 burned 7.7k calls; pace the free tier
  hackclub: 20              # cut 60->20 on 2026-09-08: provider's real limit is far below
                             # 60rpm (10k throttled calls prove it); pace under the real ceiling
  kira: 10                  # 2026-09-13: gateway is slow (504s at default pace); start at 10rpm
                             # until measured. 30M tokens/day per -free model is the real ceiling,
                             # and prompt_tokens run ~4k on trivial calls.
  openrouter: 0
  xai: 0
  groq: 30
  gemini: 10
  local: 0

paths:
  items_a: data/lol_a_items.jsonl
  premises_b: data/lol_b_wave0_premises.jsonl
  pools_c: data/lol_c_pools.jsonl
  outputs: outputs/
  judgments: judgments/
  results: results/
  site_results: site/results.json
