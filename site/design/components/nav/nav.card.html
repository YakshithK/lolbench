<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:18px 20px;background:var(--canvas)}</style><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><script src="../../_ds_bundle.js"></script></head><body><div id="root"></div><script type="text/babel">
const {TrackPanel,Tabs,Sparkline}=window.LOLBenchDesignSystem_ab2c27;
function Demo(){
 const [v,setV]=React.useState("plot");
 return <>
  <div style={{display:"flex",justifyContent:"flex-end",marginBottom:16}}>

   <TrackPanel index="02" status="you are the judge" statusTone="ink" question="Can it land one?"

    chart={<Sparkline min={0} max={348} bars={[{label:"a",value:348},{label:"b",value:348},{label:"c",value:340},{label:"d",value:192},{label:"e",value:85},{label:"f",value:19,thin:true}]}/>}

   <TrackPanel index="03" status="next data drop" statusTone="quiet" question="Does it laugh with us?"

 </>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
