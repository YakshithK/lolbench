<!-- @dsCard group="Brand" viewport="700x190" name="States and motion" subtitle="Hover to ink, press to lime, focus in lime" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px 20px;background:var(--canvas)}</style></head><body><div style="display:flex;border:var(--border);max-width:420px">
<div style="flex:1;padding:15px 6px;text-align:center;font-family:var(--mono);font-size:13px;color:var(--ink-4)">default</div>
<div style="flex:1;padding:15px 6px;text-align:center;font-family:var(--mono);font-size:13px;color:var(--ink);border-left:var(--border)">hover</div>
<div style="flex:1;padding:15px 6px;text-align:center;font-family:var(--mono);font-size:13px;background:var(--accent-brand);color:var(--canvas);border-left:var(--border)">press</div>
</div>
<div style="margin-top:16px;display:inline-block;outline:2px solid var(--accent-brand);outline-offset:2px;padding:8px 14px;font-family:var(--mono);font-size:13px;color:var(--ink)">focus-visible</div>
<div style="margin-top:16px"><span style="font-family:var(--mono);font-size:11px;color:var(--ink-3)">state transitions 120ms · one load reveal per page, 500ms, 6px rise, honours reduced-motion · no marquee, parallax or autoplay</span></div></body></html>
