# LOL Bench harness config — the whole "institutional" setup is this file.
# Every result is stamped with (dataset_version, harness_hash). Bump dataset_version when items change.

dataset_version: "0.1.0"
harness_version: "0.1.1"

# n samples per model-item (documented deviation: v0 runs 3; raised to 10 at C5)
n_samples: 3
lol_b_samples: 1          # voting uses sample 0; extra samples added at C5
max_output_tokens: 2000     # reasoning models: budget includes hidden reasoning tokens
judge_max_tokens: 1500
temperature: 0.9          # generation diversity; judge calls use temperature 0

candidates:
  - name: glm-5.3-flash
    provider: bai
    model: glm-5.3-flash
    enabled: true
  - name: deepseek-v4-flash
    provider: bai
    model: deepseek-v4-flash
    enabled: true
  - name: local-70b
    provider: local
    model: llama-3.3-70b-instruct-q4_K_M
    base_url: http://localhost:11434/v1
    enabled: false
  - name: gemini-flash
    provider: gemini
    model: gemini-2.0-flash
    enabled: false
  - name: groq-llama-3.3-70b
    provider: groq
    model: llama-3.3-70b-versatile
    enabled: false

# Judge is DeepSeek (free on b.ai). Per governance, a judge never scores its
# own family: exclude_models makes DeepSeek rows skip judging (GLM rows are
# graded by DeepSeek; DeepSeek rows await a third free family or credits).
judge:
  provider: bai
  model: deepseek-v4-flash
  exclude_models:
    - deepseek-v4-flash

# Free-tier style rate limits (requests per minute); 0 = unlimited.
# b.ai aggregator limits unknown — backoff in run.py handles 429s.
rate_limits_rpm:
  bai: 0
  groq: 30
  gemini: 10
  local: 0

paths:
  items_a: data/lol_a_items.jsonl
  premises_b: data/lol_b_wave0_premises.jsonl
  pools_c: data/lol_c_pools.jsonl
  outputs: outputs/
  judgments: judgments/
  results: results/
  site_results: site/results.json
