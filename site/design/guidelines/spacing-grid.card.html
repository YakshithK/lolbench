</div>
<div style="margin-top:14px"><span style="font-family:var(--mono);font-size:11px;color:var(--ink-3)">wrap 1300px · gutter 34px · grid cell 56px · panel gap 26px · hairline gaps of 1px between banded cells · breakpoints 1080 and 680 only</span></div></body></html>
