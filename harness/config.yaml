# LOL Bench harness config ??? the whole "institutional" setup is this file.
# Every result is stamped with (dataset_version, harness_hash). Bump dataset_version when items change.

dataset_version: "0.1.0"
harness_version: "0.1.2"

# n samples per model-item (documented deviation: v0 runs 3; raised to 10 at C5)
n_samples: 3
anchor_samples: 1          # frontier anchors run once per item (wider CIs, flagged in UI)
lol_b_samples: 1          # voting uses sample 0; extra samples added at C5
max_output_tokens: 2000     # reasoning models: budget includes hidden reasoning tokens
judge_max_tokens: 3000      # judges are reasoning models too; budget covers reasoning + JSON
judge_workers: 3            # per judge; 2 judges x 3 = 6 concurrent B.AI calls (free-tier safe)
parallel_workers: 8         # per-candidate concurrent calls
temperature: 0.9            # generation diversity; judge calls use temperature 0
max_spend_usd: 7.00         # hard stop for THIS process's paid calls (matches remaining OR credits; raise after top-up)

# Candidates: five free B.AI models for v0. Paid entries (OpenRouter/xAI)
# stay disabled until keys land.
candidates:
  - name: glm-5.3-flash
    provider: bai
    model: glm-5.3-flash
    family: zai
    enabled: true
  - name: deepseek-v4-flash
    provider: bai
    model: deepseek-v4-flash
    family: deepseek
    enabled: true
  - name: hy3
    provider: bai
    model: hy3
    family: tencent
    enabled: true
  - name: mimo-v2.5
    provider: bai
    model: mimo-v2.5
    family: xiaomi
    enabled: true
  - name: qwen3.8-flash
    provider: bai
    model: qwen3.8-flash
    family: qwen
    enabled: true
  # ---- Tier 2: OSS flagship (OpenRouter, full run) ----
  - name: glm-5.3
    provider: openrouter
    model: z-ai/glm-5.3
    family: zai
    enabled: true
  - name: deepseek-v4-pro
    provider: openrouter
    model: deepseek/deepseek-v4-pro
    family: deepseek
    enabled: true
  - name: qwen3.8-max
    provider: openrouter
    model: qwen/qwen3.8-max
    family: qwen
    enabled: true
  - name: mimo-v2.5-pro
    provider: openrouter
    model: xiaomi/mimo-v2.5-pro
    family: xiaomi
    enabled: true
  - name: hy4-preview
    provider: openrouter
    model: tencent/hy4-preview
    family: tencent
    enabled: false          # removed 2026-09: burns its whole token budget on hidden
                             # reasoning ~27-77% of the time (confirmed via cost log
                             # cross-reference), producing empty outputs that score as
                             # comprehension failures rather than infrastructure ones

  # ---- Tier 4: frontier anchors (OpenRouter/xAI, n=1) ----
  - name: gpt-5.6-sol-pro
    provider: openrouter
    model: openai/gpt-5.6-sol-pro
    family: openai
    anchor: true
    think: false            # reasoning disabled: 4x cost cut; anchor tier discloses this
    enabled: true
  - name: gemini-3.1-pro
    provider: openrouter
    model: google/gemini-3.1-pro-preview
    family: google
    anchor: true
    enabled: true
  - name: claude-opus-5
    provider: openrouter
    model: anthropic/claude-opus-5
    family: anthropic
    anchor: true
    think: false
    enabled: true
  - name: muse-spark-1.2
    provider: hackclub
    model: meta/muse-spark-1.2
    family: meta
    anchor: true
    enabled: true
  - name: grok-4.6
    provider: xai
    model: grok-4.6
    family: xai
    anchor: true
    enabled: true           # key verified 2026-09-01; owner credits cover cost

# Dual-judge protocol: every model is graded ONLY by judges from a different
# family. Exclusion is by family (the `family` tag on each candidate/judge
# above), not by exact model name — a judge from lab X must never grade any
# candidate from lab X, including sibling models it isn't literally running as.
# exclude_models stays available for one-off manual excludes on top of that.
judges:
  - name: deepseek-judge
    provider: bai
    model: deepseek-v4-flash
    family: deepseek
    exclude_models: []
    enabled: false          # provider free-tier deal ended 2026-09; can't call DeepSeek
                             # anymore. Left in this list (not deleted) so historical
                             # judgments it already made keep their correct family
                             # tag for same-family exclusion checks on old data.
  - name: qwen-judge
    provider: bai
    model: qwen3.8-flash
    family: qwen
    exclude_models: []
  - name: glm-judge
    provider: bai
    model: glm-5.3-flash
    family: zai
    exclude_models: []

# Free-tier style rate limits (requests per minute); 0 = unlimited.
rate_limits_rpm:
  bai: 60                   # quota storm on 2026-09-01 burned 7.7k calls; pace the free tier
  openrouter: 0
  xai: 0
  groq: 30
  gemini: 10
  local: 0

paths:
  items_a: data/lol_a_items.jsonl
  premises_b: data/lol_b_wave0_premises.jsonl
  pools_c: data/lol_c_pools.jsonl
  outputs: outputs/
  judgments: judgments/
  results: results/
  site_results: site/results.json
